<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Explainer - Part 3 (Validation)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700;800&display=swap');

        body {
            margin: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }

        #recording-area {
            width: 1080px;
            height: 1056px;
            position: relative;
            background: radial-gradient(circle at center, #11111a 0%, #050505 100%);
            overflow: hidden;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.1);
        }

        /* Node System */
        .nodes-container {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .node {
            width: 400px;
            background: rgba(16, 185, 129, 0.05);
            border: 2px solid rgba(16, 185, 129, 0.5);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .node-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #10b981;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }

        .node-text {
            font-size: 20px;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* JSON Validator */
        .validator {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            background: rgba(59, 130, 246, 0.1);
            border: 2px dashed rgba(59, 130, 246, 0.8);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            color: #60a5fa;
            font-size: 16px;
            font-weight: bold;
            z-index: 20;
            opacity: 0;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        #val1 {
            top: 38%;
        }

        #val2 {
            top: 63%;
        }

        /* SVG Connections */
        svg.connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .path-line {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 4;
            stroke-dasharray: 8 8;
        }

        .path-glow {
            fill: none;
            stroke: #10b981;
            stroke-width: 6;
            opacity: 0.5;
        }

        /* Data Packets */
        .data-packet {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            font-size: 14px;
            color: white;
            z-index: 15;
            opacity: 0;
            top: 0;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .packet-green {
            background-color: #10b981;
            box-shadow: 0 0 20px 5px rgba(16, 185, 129, 0.6);
        }

        .packet-red {
            background-color: #ef4444;
            box-shadow: 0 0 20px 5px rgba(239, 68, 68, 0.6);
        }

        .packet-json {
            background-color: transparent;
            color: #60a5fa;
            font-size: 24px;
            text-shadow: 0 0 10px #60a5fa;
        }

        .cross-mark {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: #ef4444;
            font-size: 80px;
            font-weight: bold;
            z-index: 50;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.8);
        }

        /* Ending Screen */
        .ending-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            z-index: 100;
            background: radial-gradient(circle at center, #0a0a1a 0%, #050505 100%);
        }

        .end-title {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #60a5fa, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-align: center;
        }

        .end-subtitle {
            font-size: 32px;
            color: #888;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .play-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            z-index: 200;
            font-family: 'Inter', sans-serif;
            border: none;
        }
    </style>
</head>

<body>
    <button class="play-btn" onclick="playAnimation()">Replay Animation</button>

    <div id="recording-area">

        <div class="nodes-container" id="pipeline-ui">
            <div class="node" id="node1">
                <div class="node-icon" id="icon1">1</div>
                <div class="node-text">Summarize the Report</div>
            </div>

            <div class="node" id="node2">
                <div class="node-icon" id="icon2">2</div>
                <div class="node-text">Extract Trends</div>
            </div>

            <div class="node" id="node3">
                <div class="node-icon" id="icon3">3</div>
                <div class="node-text">Generate Email</div>
            </div>
        </div>

        <div class="validator" id="val1">{ JSON VALIDATION }</div>
        <div class="validator" id="val2">{ JSON VALIDATION }</div>

        <svg class="connections" id="pipeline-svg">
            <!-- Line 1 to 2 -->
            <path d="M540 295 L540 460" class="path-line" />
            <path d="M540 295 L540 460" class="path-glow" id="glow1" />

            <!-- Line 2 to 3 -->
            <path d="M540 545 L540 710" class="path-line" />
            <path d="M540 545 L540 710" class="path-glow" id="glow2" />
        </svg>

        <div class="data-packet packet-green" id="packet1"></div>
        <div class="data-packet packet-red" id="packet-bad">!</div>
        <div class="data-packet packet-json" id="packet-json">{}</div>

        <div class="cross-mark" id="cross">X</div>

        <div class="ending-screen" id="ending">
            <div class="end-title" id="end-text1">PRODUCTION-GRADE<br />AGENTS</div>
            <div class="end-subtitle" id="end-text2">NEXT EPISODE ></div>
        </div>

    </div>

    <script>
        let tl;

        function playAnimation() {
            if (tl) tl.kill();

            // Initial resets
            gsap.set(["#pipeline-ui", "#pipeline-svg"], { opacity: 1 });
            gsap.set(".node", { borderColor: "rgba(16, 185, 129, 0.5)", backgroundColor: "rgba(16, 185, 129, 0.05)" });
            gsap.set(".node-icon", { backgroundColor: "#10b981", color: "#000" });
            gsap.set(".path-glow", { stroke: "#10b981" });
            gsap.set([".validator", "#ending"], { opacity: 0 });
            gsap.set(["#packet1", "#packet-bad", "#packet-json"], { opacity: 0 });
            gsap.set("#cross", { scale: 0, opacity: 0 });
            gsap.set("#recording-area", { x: 0, y: 0 });
            gsap.set(["#end-text1", "#end-text2"], { y: 20, opacity: 0 });

            tl = gsap.timeline({ delay: 0.5 });

            // Nova: "If the whole chain depends on previous outputs… what happens if step one gives bad data?"
            // Node 1 turns red, emits bad packet
            tl.to("#node1", { borderColor: "rgba(239, 68, 68, 0.8)", backgroundColor: "rgba(239, 68, 68, 0.1)", duration: 0.3 })
                .to("#icon1", { backgroundColor: "#ef4444", color: "#fff", duration: 0.3 }, "<")
                .to("#glow1", { stroke: "#ef4444", duration: 0.3 }, "<")

                // Packet travels
                .set("#packet-bad", { opacity: 1, y: 295 })
                .to("#packet-bad", { y: 460, duration: 0.6, ease: "none" })

                // Infects Node 2
                .set("#packet-bad", { opacity: 0 })
                .to("#node2", { borderColor: "rgba(239, 68, 68, 0.8)", backgroundColor: "rgba(239, 68, 68, 0.1)", duration: 0.2 })
                .to("#icon2", { backgroundColor: "#ef4444", color: "#fff", duration: 0.2 }, "<")
                .to("#glow2", { stroke: "#ef4444", duration: 0.2 }, "<")

                // Continues to Node 3
                .set("#packet-bad", { opacity: 1, y: 545 })
                .to("#packet-bad", { y: 710, duration: 0.6, ease: "none" })

                // Infects Node 3
                .set("#packet-bad", { opacity: 0 })
                .to("#node3", { borderColor: "rgba(239, 68, 68, 0.8)", backgroundColor: "rgba(239, 68, 68, 0.1)", duration: 0.2 })
                .to("#icon3", { backgroundColor: "#ef4444", color: "#fff", duration: 0.2 }, "<")

                // Whole pipeline shakes
                .to("#pipeline-ui", { x: "random(-8, 8, 5)", duration: 0.05, repeat: 20, yoyo: true });

            // You: "That’s exactly why production systems use validation and structured outputs like JSON between steps."
            // Flash and reset to green
            tl.to(".node", { borderColor: "rgba(16, 185, 129, 0.5)", backgroundColor: "rgba(16, 185, 129, 0.05)", duration: 0.3 }, "+=0.5")
                .to(".node-icon", { backgroundColor: "#10b981", color: "#000", duration: 0.3 }, "<")
                .to(".path-glow", { stroke: "#10b981", duration: 0.3 }, "<")
                // Introduce Validators
                .to(".validator", { opacity: 1, y: -10, duration: 0.5, ease: "back.out(1.5)" }, "+=0.2");

            // "Because one messy output can break the entire pipeline."
            // Node 1 fires a red packet again
            tl.to("#node1", { borderColor: "rgba(239, 68, 68, 0.5)", duration: 0.2 })
                .set("#packet-bad", { opacity: 1, y: 295 })
                .to("#packet-bad", { y: 380, duration: 0.4, ease: "none" }) // Hits validator 1

                // BLOCKED!
                .to("#val1", { borderColor: "rgba(239, 68, 68, 1)", backgroundColor: "rgba(239, 68, 68, 0.2)", color: "#ef4444", duration: 0.1 })
                .to("#cross", { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, "<")
                .to("#packet-bad", { scale: 2, opacity: 0, duration: 0.2 }, "<")

                // Reset validator after blocking
                .to("#val1", { borderColor: "rgba(59, 130, 246, 0.8)", backgroundColor: "rgba(59, 130, 246, 0.1)", color: "#60a5fa", duration: 0.3 }, "+=0.5")
                .to("#cross", { opacity: 0, scale: 0, duration: 0.2 }, "<")
                .to("#node1", { borderColor: "rgba(16, 185, 129, 0.5)", duration: 0.3 }, "<");

            // "Good agent systems don’t just chain prompts… They control the data flowing between them."
            // Clean JSON packet flows
            tl.set("#packet-json", { opacity: 1, y: 295 })
                .to("#packet-json", { y: 395, duration: 0.4, ease: "none" }) // To validator
                .to("#val1", { boxShadow: "0 0 30px rgba(96, 165, 250, 0.8)", duration: 0.2, yoyo: true, repeat: 1 })
                .to("#packet-json", { y: 460, duration: 0.4, ease: "none" }) // To Node 2
                .set("#packet-json", { opacity: 0 })
                .to("#node2", { boxShadow: "0 0 30px rgba(16, 185, 129, 0.4)", duration: 0.2, yoyo: true, repeat: 1 })

                // Node 2 to 3
                .set("#packet-json", { opacity: 1, y: 545 })
                .to("#packet-json", { y: 645, duration: 0.4, ease: "none" }) // To validator 2
                .to("#val2", { boxShadow: "0 0 30px rgba(96, 165, 250, 0.8)", duration: 0.2, yoyo: true, repeat: 1 })
                .to("#packet-json", { y: 710, duration: 0.4, ease: "none" }) // To Node 3
                .set("#packet-json", { opacity: 0 })
                .to("#node3", { boxShadow: "0 0 30px rgba(16, 185, 129, 0.4)", duration: 0.2, yoyo: true, repeat: 1 });

            // Ending: "And that structured-output layer? That’s actually what separates toy AI demos from real production-grade agents. We’ll break that down in the next episode."
            tl.to(["#pipeline-ui", "#pipeline-svg", ".validator"], { opacity: 0, y: -20, duration: 1, ease: "power2.in" }, "+=1")
                .to("#ending", { opacity: 1, duration: 1 })
                .to("#end-text1", { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, "-=0.5")
                .to("#end-text2", { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, "-=0.4");
        }

        window.onload = playAnimation;
    </script>
</body>

</html>
