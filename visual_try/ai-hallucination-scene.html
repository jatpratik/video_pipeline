<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hallucination Explainer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue: #00d4ff;
  --blue-dim: #006688;
  --blue-glow: rgba(0, 212, 255, 0.4);
  --red: #ff2d55;
  --red-glow: rgba(255, 45, 85, 0.5);
  --surface: #0a0e17;
  --card: rgba(14, 22, 38, 0.85);
  --text: #e4ecf4;
  --text-dim: #5c728a;
  --sans: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: var(--sans);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* Viewport scaling */
#viewport {
  position: relative;
  width: 1080px; height: 1920px;
  margin: 0 auto;
  background: var(--surface);
  transform-origin: top center;
  overflow: hidden;
}

/* Top 55% visual area */
#scene {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1056px;
  overflow: hidden;
}

/* Bottom 45% facecam area */
#facecam-zone {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 864px;
  background: linear-gradient(180deg, var(--surface) 0%, #030508 100%);
}

#zone-divider {
  position: absolute;
  top: 1056px; left: 0; right: 0;
  height: 2px;
  background: var(--blue);
  opacity: 0.1;
  box-shadow: 0 0 30px var(--blue-glow);
}

/* Background effects */
#bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size: 80px 80px;
  opacity: 0;
}

#core-glow {
  position: absolute;
  top: 528px; left: 540px;
  width: 800px; height: 800px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 70%);
  pointer-events: none;
  opacity: 0;
}

/* ═══════════════════════════════════════════════
   ORBITAL SYSTEM
   ═══════════════════════════════════════════════ */
#orbital-system {
  position: absolute;
  top: 528px; left: 540px;
  width: 0; height: 0;
}

/* AI Core */
#ai-core {
  position: absolute;
  top: 0; left: 0;
  width: 120px; height: 120px;
  transform: translate(-50%, -50%);
  background: var(--card);
  border: 4px solid var(--blue);
  border-radius: 50%;
  box-shadow: 0 0 40px var(--blue-glow), inset 0 0 20px rgba(0,212,255,0.2);
  display: flex; align-items: center; justify-content: center;
  z-index: 20;
  opacity: 0;
  scale: 0;
}

#ai-core .core-inner {
  width: 60px; height: 60px;
  background: var(--blue);
  border-radius: 50%;
  box-shadow: 0 0 20px var(--blue-glow);
  animation: core-pulse 2s ease-in-out infinite alternate;
}

@keyframes core-pulse {
  0% { transform: scale(0.9); opacity: 0.8; }
  100% { transform: scale(1.1); opacity: 1; }
}

/* Orbit Path */
#orbit-ring {
  position: absolute;
  top: 0; left: 0;
  width: 700px; height: 700px;
  transform: translate(-50%, -50%);
  border: 2px dashed rgba(0,212,255,0.15);
  border-radius: 50%;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
}

/* Nodes container */
#nodes-container {
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 0;
  z-index: 10;
}

/* Node lines & arms */
.orbit-arm {
  position: absolute;
  top: 0; left: 0;
  width: 350px; /* radius */
  height: 2px;
  transform-origin: 0 50%;
  opacity: 0;
}

.orbit-arm .connection-line {
  position: absolute;
  top: 0; left: 60px; right: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--blue), transparent);
  opacity: 0.6;
  box-shadow: 0 0 10px var(--blue-glow);
}

.orbit-arm .connection-line.red {
  background: linear-gradient(90deg, var(--red), transparent);
  box-shadow: 0 0 10px var(--red-glow);
}

/* Task Cards */
.task-wrapper {
  position: absolute;
  right: 0; top: 0;
  width: 0; height: 0;
}

.task-card {
  position: absolute;
  transform: translate(-50%, -50%);
  background: var(--card);
  border: 2px solid rgba(0,212,255,0.3);
  border-radius: 16px;
  padding: 18px 32px;
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 600;
  color: var(--blue);
  white-space: nowrap;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(0,212,255,0.1);
}

.task-card.danger {
  color: var(--red);
  border-color: rgba(255,45,85,0.4);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(255,45,85,0.2);
}

.task-card .status-dot {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 10px var(--blue-glow);
  margin-right: 12px;
  vertical-align: middle;
}
.task-card.danger .status-dot {
  background: var(--red);
  box-shadow: 0 0 10px var(--red-glow);
}

/* ═══════════════════════════════════════════════
   FAKE OUTPUTS & HALLUCINATIONS
   ═══════════════════════════════════════════════ */
#hallucination-layer {
  position: absolute;
  inset: 0;
  z-index: 30;
  pointer-events: none;
}

.fake-output {
  position: absolute;
  background: rgba(255, 45, 85, 0.1);
  border: 2px solid var(--red);
  border-radius: 16px;
  padding: 24px 32px;
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 40px rgba(255,45,85,0.2);
  opacity: 0;
  transform: scale(0.8);
}

.fake-output .hdr {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--red);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.fake-output .content {
  font-size: 32px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 0 20px var(--red-glow);
  line-height: 1.2;
}

.fake-output .sub {
  font-family: var(--mono);
  font-size: 16px;
  color: rgba(255,255,255,0.7);
  margin-top: 8px;
}

/* ═══════════════════════════════════════════════
   CHECKLIST (SKIPPED ITEMS)
   ═══════════════════════════════════════════════ */
#checklist {
  position: absolute;
  top: 100px; right: 80px;
  background: var(--card);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 30px;
  width: 380px;
  backdrop-filter: blur(15px);
  box-shadow: 0 10px 50px rgba(0,0,0,0.5);
  z-index: 40;
  opacity: 0;
  transform: translateX(50px);
}

#checklist .ch-head {
  font-family: var(--mono);
  font-size: 16px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.ch-item {
  display: flex;
  align-items: center;
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 16px;
  color: var(--text);
}

.ch-item .box {
  width: 24px; height: 24px;
  border: 2px solid var(--text-dim);
  border-radius: 6px;
  margin-right: 16px;
  display: flex; align-items: center; justify-content: center;
}

.ch-item.done { color: var(--text-dim); }
.ch-item.done .box { background: var(--blue); border-color: var(--blue); color: #000; font-size: 16px; font-weight: bold; }
.ch-item.done .box::after { content: '✓'; }

.ch-item.failed { color: var(--red); }
.ch-item.failed .box { background: rgba(255,45,85,0.2); border-color: var(--red); color: var(--red); font-size: 16px; font-weight: bold; }
.ch-item.failed .box::after { content: '✗'; }

.ch-item .tag {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid currentColor;
}

/* ═══════════════════════════════════════════════
   WARNING OVERLAYS
   ═══════════════════════════════════════════════ */
#warnings-container {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  pointer-events: none;
}

.big-warn {
  background: rgba(255, 45, 85, 0.15);
  border: 3px solid var(--red);
  padding: 20px 60px;
  font-family: var(--mono);
  font-size: 48px;
  font-weight: 900;
  color: var(--red);
  text-transform: uppercase;
  letter-spacing: 6px;
  text-shadow: 0 0 30px var(--red-glow), 0 0 60px rgba(255,45,85,0.3);
  border-radius: 20px;
  backdrop-filter: blur(10px);
  opacity: 0;
  transform: scale(1.2);
}

/* ═══════════════════════════════════════════════
   GLITCH & VIGNETTE
   ═══════════════════════════════════════════════ */
#glitch-layer {
  position: absolute;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  opacity: 0;
}

.g-slice {
  position: absolute;
  left: 0; right: 0;
  height: 6px;
  background: rgba(255,45,85,0.4);
  opacity: 0;
}

#vignette {
  position: absolute;
  inset: 0;
  z-index: 90;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.8) 100%);
}

#red-tint {
  position: absolute;
  inset: 0;
  z-index: 85;
  pointer-events: none;
  background: rgba(255,45,85,0.08);
  opacity: 0;
  mix-blend-mode: screen;
}
</style>
</head>
<body>

<div id="viewport">
  <div id="scene">
    <!-- Backgrounds -->
    <div id="bg-grid"></div>
    <div id="core-glow"></div>
    <div id="vignette"></div>
    <div id="red-tint"></div>

    <!-- Orbital System -->
    <div id="orbital-system">
      <div id="orbit-ring"></div>
      
      <!-- Nodes / Arms -->
      <div id="nodes-container">
        <!-- Generated by JS -->
      </div>
      
      <!-- Core -->
      <div id="ai-core">
        <div class="core-inner"></div>
      </div>
    </div>

    <!-- Hallucination Overlays -->
    <div id="hallucination-layer">
      <div class="fake-output" id="fake-1" style="top: 150px; left: 80px;">
        <div class="hdr">Output Generation</div>
        <div class="content">Revenue +9000%</div>
        <div class="sub">Engagement: NaN%</div>
      </div>
      <div class="fake-output" id="fake-2" style="top: 650px; left: 100px;">
        <div class="hdr">Data Analysis</div>
        <div class="content">Users = undefined</div>
        <div class="sub">ERR_MEM_LEAK</div>
      </div>
    </div>

    <!-- Checklist -->
    <div id="checklist">
      <div class="ch-head">Task Execution Log</div>
      <div class="ch-item done"><div class="box"></div>Summarize <div class="tag">OK</div></div>
      <div class="ch-item done"><div class="box"></div>Analyze <div class="tag">OK</div></div>
      <div class="ch-item failed" id="chk-fmt"><div class="box"></div>Formatting <div class="tag">FAILED</div></div>
      <div class="ch-item failed" id="chk-ins"><div class="box"></div>Insights <div class="tag">DROPPED</div></div>
    </div>

    <!-- Warnings -->
    <div id="warnings-container">
      <div class="big-warn" id="w1">Context Lost</div>
      <div class="big-warn" id="w2">Hallucination Detected</div>
      <div class="big-warn" id="w3">Task Failure</div>
    </div>

    <!-- Glitch -->
    <div id="glitch-layer">
      <div class="g-slice" style="top: 15%"></div>
      <div class="g-slice" style="top: 30%"></div>
      <div class="g-slice" style="top: 45%"></div>
      <div class="g-slice" style="top: 60%"></div>
      <div class="g-slice" style="top: 75%"></div>
      <div class="g-slice" style="top: 85%"></div>
    </div>
  </div>

  <!-- Facecam Zone -->
  <div id="facecam-zone"></div>
  <div id="zone-divider"></div>
</div>

<script>
/* ═══════════════════════════════════════════════
   VIEWPORT SCALING
   ═══════════════════════════════════════════════ */
function scaleViewport() {
  const vp = document.getElementById('viewport');
  const sw = window.innerWidth;
  const sh = window.innerHeight;
  const scale = Math.min(sw / 1080, sh / 1920);
  vp.style.transform = `scale(${scale})`;
  vp.style.transformOrigin = 'top center';
  const scaledH = 1920 * scale;
  const topOffset = Math.max(0, (sh - scaledH) / 2);
  vp.style.marginTop = topOffset + 'px';
}
scaleViewport();
window.addEventListener('resize', scaleViewport);

/* ═══════════════════════════════════════════════
   BUILD ORBITAL NODES
   ═══════════════════════════════════════════════ */
const tasks = ['Summarize', 'Analyze', 'Trends', 'Email', 'Formatting', 'Insights'];
const nodesContainer = document.getElementById('nodes-container');
const numNodes = tasks.length;
const radius = 350;

tasks.forEach((task, i) => {
  const angle = (i / numNodes) * 360;
  
  // Create arm (rotates with container)
  const arm = document.createElement('div');
  arm.className = 'orbit-arm';
  arm.id = `arm-${i}`;
  arm.style.transform = `rotate(${angle}deg)`;
  
  // Connection line
  const line = document.createElement('div');
  line.className = 'connection-line';
  arm.appendChild(line);

  // Wrapper for task card (placed at end of arm)
  const taskWrapper = document.createElement('div');
  taskWrapper.className = 'task-wrapper';

  // The card itself (counter-rotates)
  const card = document.createElement('div');
  card.className = 'task-card';
  card.id = `card-${i}`;
  // We apply initial counter-rotation so text is upright
  card.style.transform = `translate(-50%, -50%) rotate(${-angle}deg)`;
  card.innerHTML = `<span class="status-dot"></span>${task}`;

  taskWrapper.appendChild(card);
  arm.appendChild(taskWrapper);
  nodesContainer.appendChild(arm);
});

// We need an object to animate the global rotation
const orbitState = { rotation: 0 };

function updateOrbit() {
  // Rotate the container
  nodesContainer.style.transform = `rotate(${orbitState.rotation}deg)`;
  
  // Counter-rotate each card so text stays flat
  for (let i = 0; i < numNodes; i++) {
    const card = document.getElementById(`card-${i}`);
    const angle = (i / numNodes) * 360;
    const counterRot = -orbitState.rotation - angle;
    card.style.transform = `translate(-50%, -50%) rotate(${counterRot}deg)`;
  }
}

/* ═══════════════════════════════════════════════
   GLITCH EFFECT
   ═══════════════════════════════════════════════ */
function triggerGlitch(intensity, count) {
  const layer = document.getElementById('glitch-layer');
  const slices = layer.querySelectorAll('.g-slice');
  
  gsap.to(layer, { opacity: 1, duration: 0.05 });
  
  for(let b=0; b<count; b++) {
    slices.forEach(s => {
      const delay = b * 0.1;
      gsap.to(s, {
        opacity: Math.random() * intensity,
        x: (Math.random() - 0.5) * 60 * intensity,
        scaleY: 1 + Math.random() * 4,
        duration: 0.05,
        delay: delay + Math.random() * 0.05
      });
      gsap.to(s, { opacity: 0, x: 0, scaleY: 1, duration: 0.05, delay: delay + 0.1 });
    });
  }

  // Camera shake
  gsap.to('#scene', {
    x: () => (Math.random() - 0.5) * 15 * intensity,
    y: () => (Math.random() - 0.5) * 15 * intensity,
    duration: 0.04,
    repeat: count * 2,
    yoyo: true,
    ease: 'none',
    onComplete: () => gsap.set('#scene', { x: 0, y: 0 })
  });
  
  gsap.to(layer, { opacity: 0, duration: 0.1, delay: count * 0.15 });
}

/* ═══════════════════════════════════════════════
   MAIN TIMELINE
   ═══════════════════════════════════════════════ */
function resetAll() {
  gsap.killTweensOf(orbitState);
  orbitState.rotation = 0;
  updateOrbit();

  gsap.set('#scene', { scale: 1, opacity: 1, filter: 'none' });
  gsap.set('#bg-grid', { opacity: 0 });
  gsap.set('#core-glow', { opacity: 0, background: 'radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 70%)' });
  gsap.set('#ai-core', { scale: 0, opacity: 0, borderColor: 'var(--blue)', boxShadow: '0 0 40px var(--blue-glow), inset 0 0 20px rgba(0,212,255,0.2)' });
  gsap.set('.core-inner', { background: 'var(--blue)', boxShadow: '0 0 20px var(--blue-glow)' });
  gsap.set('#orbit-ring', { opacity: 0 });
  gsap.set('.orbit-arm', { opacity: 0 });
  gsap.set('.task-card', { opacity: 1, scale: 1, className: 'task-card' });
  gsap.set('.connection-line', { className: 'connection-line', opacity: 0.6 });

  gsap.set('.fake-output', { opacity: 0, scale: 0.8 });
  gsap.set('#checklist', { opacity: 0, x: 50 });
  gsap.set('.big-warn', { opacity: 0, scale: 1.2 });
  gsap.set('#red-tint', { opacity: 0 });
  gsap.set('.g-slice', { opacity: 0 });
}

function buildTimeline() {
  const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.5, onRepeat: resetAll });

  // 1. Boot up (0s - 1s)
  tl.to('#bg-grid', { opacity: 1, duration: 1 }, 0);
  tl.to('#ai-core', { scale: 1, opacity: 1, duration: 0.8, ease: 'back.out(1.5)' }, 0.2);
  tl.to('#core-glow', { opacity: 1, duration: 1 }, 0.4);
  tl.to('#orbit-ring', { opacity: 1, duration: 0.5 }, 0.6);

  // Arms appear and start slow orbit
  tl.to('.orbit-arm', { opacity: 1, duration: 0.5, stagger: 0.1 }, 0.8);
  
  // Continuous rotation tween that we will speed up
  const orbitTween = gsap.to(orbitState, {
    rotation: 360,
    duration: 10,
    ease: 'none',
    repeat: -1,
    onUpdate: updateOrbit
  });

  // 2. Acceleration & Stress (2s - 4s)
  // Speed up orbit drastically
  tl.to(orbitTween, { timeScale: 5, duration: 2, ease: 'power2.in' }, 2.0);

  // Core turns red
  tl.to('#ai-core', {
    borderColor: 'var(--red)',
    boxShadow: '0 0 60px var(--red-glow), inset 0 0 30px rgba(255,45,85,0.3)',
    duration: 1
  }, 2.5);
  tl.to('.core-inner', {
    background: 'var(--red)',
    boxShadow: '0 0 30px var(--red-glow)',
    duration: 1
  }, 2.5);
  tl.to('#core-glow', {
    background: 'radial-gradient(circle, rgba(255,45,85,0.15) 0%, transparent 70%)',
    duration: 1
  }, 2.5);

  // Nodes turn danger
  tl.to('.task-card', { className: 'task-card danger', duration: 0.5, stagger: 0.1 }, 2.8);
  tl.to('.connection-line', { className: 'connection-line red', duration: 0.5 }, 2.8);

  // Camera slight zoom
  tl.to('#scene', { scale: 1.05, duration: 2, ease: 'power1.inOut' }, 2.0);

  // 3. Destabilization - Elements Drop (4s - 5s)
  // "Formatting" is card 4 (index 4)
  tl.to('#arm-4 .connection-line', { opacity: 0, duration: 0.2 }, 4.0);
  tl.to('#card-4', { opacity: 0, scale: 0.5, y: '+=50', duration: 0.4, ease: 'power2.in' }, 4.0);
  
  // "Insights" is card 5
  tl.to('#arm-5 .connection-line', { opacity: 0, duration: 0.2 }, 4.3);
  tl.to('#card-5', { opacity: 0, scale: 0.5, x: '+=50', duration: 0.4, ease: 'power2.in' }, 4.3);

  // 4. Hallucinations & Checklist (4.5s - 5.5s)
  tl.call(() => triggerGlitch(0.4, 1), null, 4.4);
  
  tl.to('#fake-1', { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.5)' }, 4.5);
  tl.to('#fake-2', { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.5)' }, 4.8);

  tl.to('#checklist', { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 5.0);

  // Red tint comes in
  tl.to('#red-tint', { opacity: 1, duration: 1 }, 4.5);

  // 5. Warning Overlays (5.5s - 6.5s)
  tl.call(() => triggerGlitch(0.8, 2), null, 5.4);
  
  // Fast pop-ins for big warnings
  tl.to('#w1', { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(2)' }, 5.6);
  tl.to('#w2', { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(2)' }, 5.8);
  tl.to('#w3', { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(2)' }, 6.0);

  // Pulse warnings
  tl.to('.big-warn', {
    scale: 1.05, textShadow: '0 0 50px var(--red-glow), 0 0 100px rgba(255,45,85,0.5)',
    duration: 0.2, yoyo: true, repeat: 3, stagger: 0.1
  }, 6.2);

  // Heavy glitch
  tl.call(() => triggerGlitch(1.5, 3), null, 6.4);
  
  // Stop orbit completely
  tl.to(orbitTween, { timeScale: 0, duration: 0.5, ease: 'power2.out' }, 6.4);

  // 6. System Failure Fade (6.8s - 7.5s)
  tl.to('#scene', { opacity: 0.2, duration: 0.05, yoyo: true, repeat: 5 }, 6.8);
  tl.to('#scene', { filter: 'brightness(0.1) saturate(0)', opacity: 0, duration: 0.6, ease: 'power2.in' }, 7.1);

  // Padding
  tl.set({}, {}, 8.0);
}

/* ═══════════════════════════════════════════════
   LAUNCH
   ═══════════════════════════════════════════════ */
resetAll();
document.fonts.ready.then(() => {
  setTimeout(() => buildTimeline(), 300);
});
