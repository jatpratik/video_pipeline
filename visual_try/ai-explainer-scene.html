<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Explainer - Part 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }

        #recording-area {
            width: 1080px;
            height: 1056px;
            position: relative;
            background: radial-gradient(circle at center, #11111a 0%, #050505 100%);
            overflow: hidden;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.1); /* Visual guide for end of recording area */
        }

        .header {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 20px;
            color: #888;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .prompt-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            width: 600px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .prompt-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            width: 600px;
            height: 250px;
            background: rgba(80, 120, 255, 0.3);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 5;
            opacity: 0;
        }

        .ai-label {
            display: inline-block;
            background: rgba(80, 120, 255, 0.2);
            color: #8bb4ff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            align-self: flex-start;
            margin-bottom: 8px;
        }

        .text-content {
            font-size: 26px;
            line-height: 1.6;
            color: #e2e8f0;
            min-height: 40px;
            font-family: 'JetBrains Mono', monospace; /* Monospace feels more like a prompt */
        }
        
        .cursor {
            display: inline-block;
            width: 14px;
            height: 30px;
            background-color: #5078ff;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .overload-warning {
            position: absolute;
            top: -24px;
            right: -24px;
            background: #ef4444;
            color: white;
            font-size: 16px;
            font-weight: 800;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.6);
            opacity: 0;
            transform: scale(0.5);
            z-index: 20;
            letter-spacing: 1px;
            border: 1px solid #ff8888;
        }

        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
            opacity: 0;
            mix-blend-mode: overlay;
            z-index: 50;
            pointer-events: none;
        }
        
        .play-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            font-family: 'Inter', sans-serif;
            border: none;
        }
    </style>
</head>
<body>
    <button class="play-btn" onclick="playAnimation()">Replay Animation</button>
    
    <div id="recording-area">
        <div class="glitch-overlay" id="glitch"></div>
        
        <div class="header" id="header">
            <h1>GIANT PROMPT</h1>
            <p>SYSTEM FAILURE</p>
        </div>

        <div class="prompt-glow" id="glow"></div>
        
        <div class="prompt-container" id="prompt-box">
            <div class="ai-label">SYSTEM.PROMPT_INPUT</div>
            <div class="overload-warning" id="warning1">CONTEXT LIMIT EXCEEDED</div>
            <div class="overload-warning" id="warning2" style="top: auto; bottom: -24px; left: -24px; right: auto;">COGNITIVE OVERLOAD</div>
            <div class="text-content">
                <span id="typed-text"></span><span class="cursor" id="cursor"></span>
            </div>
        </div>
    </div>

    <script>
        gsap.registerPlugin(TextPlugin);
        let tl;

        function playAnimation() {
            if (tl) tl.kill(); // Reset if already playing
            
            // Reset elements
            gsap.set(["#header", "#glow", "#warning1", "#warning2", "#glitch"], { opacity: 0 });
            gsap.set(["#warning1", "#warning2"], { scale: 0.5 });
            gsap.set("#prompt-box", { width: 600, height: "auto", borderColor: "rgba(255, 255, 255, 0.1)", backgroundColor: "rgba(255, 255, 255, 0.03)", boxShadow: "0 12px 48px rgba(0, 0, 0, 0.5)", rotation: 0, scale: 1, y: 0, opacity: 1 });
            gsap.set("#glow", { backgroundColor: "rgba(80, 120, 255, 0.3)" });
            gsap.set("#typed-text", { text: "", color: "#e2e8f0" });
            gsap.set("#recording-area", { x: 0, y: 0 });
            gsap.set(".text-content", { fontSize: "26px" });
            gsap.set("#cursor", { backgroundColor: "#5078ff" });

            // Set up a strict 20-second timeline using absolute positioning
            tl = gsap.timeline();

            // 0s - 4s: Hook
            tl.to("#header", { opacity: 1, y: 20, duration: 2, ease: "power3.out" }, 0.5)
              .from("#prompt-box", { y: 50, opacity: 0, duration: 1.5, ease: "back.out(1.5)" }, 1)
              .to("#glow", { opacity: 0.8, duration: 3, ease: "power2.inOut", yoyo: true, repeat: 1 }, 1);

            // ~6s: "They write one massive prompt."
            tl.to("#prompt-box", { width: 900, duration: 2, ease: "power4.inOut" }, 6)
              .to(".text-content", { fontSize: "32px", duration: 1.5 }, 6);

            // 12s - 18s: "Analyze this report..."
            const massivePrompt = "Analyze this report, find trends, summarize everything, write an email, and make it professional.";
            
            tl.to("#typed-text", {
                duration: 6, 
                text: { value: massivePrompt, delimiter: "" },
                ease: "none"
            }, 12);

            // 16s: The model starts struggling mid-type
            tl.to("#glow", { backgroundColor: "rgba(255, 165, 0, 0.4)", duration: 2 }, 16)
              .to("#prompt-box", { borderColor: "rgba(255, 165, 0, 0.6)", duration: 2 }, 16);

            // 18s: Box completely overloaded
            tl.to("#glow", { backgroundColor: "rgba(239, 68, 68, 0.5)", duration: 0.5 }, 18)
              .to("#prompt-box", { 
                  borderColor: "rgba(239, 68, 68, 0.9)", 
                  backgroundColor: "rgba(239, 68, 68, 0.1)",
                  boxShadow: "0 12px 64px rgba(239, 68, 68, 0.5)",
                  duration: 0.5 
              }, 18)
              .to("#cursor", { backgroundColor: "#ef4444", duration: 0.2 }, 18);

            // 18s: Camera shake building up
            tl.to("#recording-area", {
                x: "random(-8, 8, 5)",
                y: "random(-8, 8, 5)",
                duration: 0.05,
                repeat: 10, // lasts 0.5s
                yoyo: true
            }, 18);

            // 18.5s - 20s: "And then the model completely falls apart."
            tl.to("#warning1", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 18.5)
              .to("#warning2", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 18.7)
              .to("#glitch", { opacity: 0.4, duration: 0.05, repeat: 30, yoyo: true }, 18.5) // lasts 1.5s
              .to("#recording-area", {
                  x: "random(-25, 25, 5)",
                  y: "random(-25, 25, 5)",
                  duration: 0.05,
                  repeat: 30,
                  yoyo: true
              }, 18.5)
              .to("#typed-text", { color: "#ef4444", duration: 0.1 }, 18.5)
              .to("#prompt-box", { rotation: -3, scale: 1.02, duration: 0.1, ease: "rough" }, 18.5);
              
            // 20.1s: Reset position after shake
            tl.set("#recording-area", { x: 0, y: 0 }, 20.1);
        }

        // Start animation on load
        window.onload = playAnimation;
    </script>
</body>
</html>
