<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1080px;
            height: 960px;
            background: #050505;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        .bg {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 45%, #0a0a18 0%, #050505 100%);
        }

        .terminal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            background: rgba(15, 15, 25, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            overflow: hidden;
            opacity: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .terminal-bar {
            height: 40px;
            background: rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
        }
        .dot-r { background: #ef4444; }
        .dot-y { background: #eab308; }
        .dot-g { background: #22c55e; }
        .bar-title {
            margin-left: 12px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .terminal-body {
            padding: 28px 32px;
            min-height: 320px;
        }

        .code-line {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
            opacity: 0;
        }
        .line-num {
            width: 36px;
            text-align: right;
            color: rgba(255,255,255,0.15);
            font-size: 14px;
            margin-right: 20px;
            flex-shrink: 0;
            user-select: none;
        }
        .line-text {
            font-size: 17px;
            line-height: 1.7;
            color: #94a3b8;
            white-space: pre-wrap;
        }

        /* Syntax colours */
        .syn-kw   { color: #c084fc; }   /* purple — keywords */
        .syn-fn   { color: #60a5fa; }   /* blue — functions */
        .syn-str  { color: #34d399; }   /* green — strings */
        .syn-num  { color: #f59e0b; }   /* amber — numbers */
        .syn-cmt  { color: rgba(255,255,255,0.2); font-style: italic; }

        .cursor-blink {
            display: inline-block;
            width: 10px; height: 20px;
            background: #60a5fa;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50%     { opacity: 0; }
        }

        /* Glow on emphasis */
        .line-glow {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(96,165,250,0.04);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="terminal" id="term">
        <div class="terminal-bar">
            <div class="dot dot-r"></div>
            <div class="dot dot-y"></div>
            <div class="dot dot-g"></div>
            <div class="bar-title">terminal</div>
        </div>
        <div class="terminal-body" id="body"></div>
    </div>

    <script>
        gsap.registerPlugin(TextPlugin);
        const S = {{ scene_data_json }};

        /* Build code lines from elements or split text */
        const body = document.getElementById('body');
        const lines = S.elements && S.elements.length > 0
            ? S.elements
            : S.text.split(/[.!?]+/).map(s => s.trim()).filter(Boolean);

        const lineEls = [];
        lines.forEach((txt, i) => {
            const row = document.createElement('div');
            row.className = 'code-line';
            row.id = 'line' + i;
            row.style.position = 'relative';
            row.innerHTML = `
                <div class="line-num">${i + 1}</div>
                <div class="line-text" id="lt${i}"></div>
                <div class="line-glow" id="lg${i}"></div>
            `;
            body.appendChild(row);
            lineEls.push(row);
        });

        /* Add blinking cursor */
        const cursorEl = document.createElement('span');
        cursorEl.className = 'cursor-blink';
        cursorEl.id = 'cursor';

        document.fonts.ready.then(() => {
            const tl = gsap.timeline({
                onComplete: () => { document.title = 'DONE'; }
            });

            /* Terminal appears */
            tl.to('#term', { opacity: 1, y: -10, duration: 0.4, ease: 'power2.out' }, 0.1);

            /* Type each line */
            const lineTime = (S.duration - 0.6) / lines.length;

            lines.forEach((txt, i) => {
                const t = 0.5 + lineTime * i;

                /* Show line */
                tl.to('#line' + i, { opacity: 1, duration: 0.1 }, t);

                /* Type text */
                tl.to('#lt' + i, {
                    duration: lineTime * 0.75,
                    text: { value: txt, delimiter: '' },
                    ease: 'none'
                }, t + 0.05);
            });

            /* Word emphasis: flash the line glow */
            S.words.forEach(w => {
                if (!w.emphasis) return;
                const kwLower = w.word.toLowerCase().replace(/[.,!?;:'"]/g, '');
                lines.forEach((txt, i) => {
                    if (txt.toLowerCase().includes(kwLower)) {
                        tl.to('#lg' + i, {
                            opacity: 1,
                            duration: 0.1,
                            ease: 'power2.in'
                        }, w.start);
                        tl.to('#lg' + i, {
                            opacity: 0,
                            duration: 0.5,
                            ease: 'power2.out'
                        }, w.start + 0.15);
                    }
                });
            });

            /* Exact duration */
            tl.to({}, { duration: 0.001 }, S.duration - 0.001);
        });
    </script>
</body>
</html>
