<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1080px;
            height: 960px;
            background: #050505;
            font-family: 'Inter', sans-serif;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        .bg {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 45%, #0a0a1a 0%, #050505 100%);
        }

        .title {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            opacity: 0;
        }

        .pipeline {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .node {
            width: 440px;
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            transform: translateY(20px);
            position: relative;
        }
        .node-num {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 18px;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .node-label {
            font-size: 22px;
            font-weight: 600;
            color: #cbd5e1;
        }

        /* Connector lines */
        .connector {
            width: 3px;
            height: 28px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            opacity: 0;
            position: relative;
        }
        .connector-glow {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 3px; height: 0%;
            background: #10b981;
            border-radius: 2px;
            box-shadow: 0 0 12px rgba(16,185,129,0.6);
        }

        /* Active state */
        .node.active {
            border-color: rgba(16,185,129,0.5);
            background: rgba(16,185,129,0.05);
        }
        .node.active .node-num {
            background: #10b981;
            color: #000;
        }
        .node.active .node-label {
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="title" id="title"></div>
    <div class="pipeline" id="pipeline"></div>

    <script>
        const S = {{ scene_data_json }};

        /* Build nodes from elements */
        const pipeline = document.getElementById('pipeline');
        const elems = S.elements && S.elements.length > 0
            ? S.elements
            : [S.text];

        const nodeEls = [];
        const connEls = [];

        elems.forEach((label, i) => {
            /* Node */
            const node = document.createElement('div');
            node.className = 'node';
            node.id = 'node' + i;
            node.innerHTML = `
                <div class="node-num">${i + 1}</div>
                <div class="node-label">${label}</div>
            `;
            pipeline.appendChild(node);
            nodeEls.push(node);

            /* Connector (except after last) */
            if (i < elems.length - 1) {
                const conn = document.createElement('div');
                conn.className = 'connector';
                conn.id = 'conn' + i;
                conn.innerHTML = '<div class="connector-glow" id="cg' + i + '"></div>';
                pipeline.appendChild(conn);
                connEls.push(conn);
            }
        });

        /* Optional title from visual_concept */
        if (S.visual_concept) {
            document.getElementById('title').textContent = '';
        }

        document.fonts.ready.then(() => {
            const tl = gsap.timeline({
                onComplete: () => { document.title = 'DONE'; }
            });

            const count = nodeEls.length;
            const stepTime = S.duration / (count + 0.5);

            /* Stagger node appearances */
            nodeEls.forEach((node, i) => {
                const t = stepTime * i + 0.1;

                tl.to(node, {
                    opacity: 1,
                    y: 0,
                    duration: 0.35,
                    ease: 'power2.out'
                }, t);

                /* Connector after previous node */
                if (i > 0 && connEls[i - 1]) {
                    tl.to(connEls[i - 1], { opacity: 1, duration: 0.15 }, t - 0.2);
                    tl.to('#cg' + (i - 1), {
                        height: '100%',
                        duration: 0.25,
                        ease: 'none'
                    }, t - 0.15);
                }
            });

            /* Word-level emphasis: pulse the matching node */
            S.words.forEach(w => {
                if (!w.emphasis) return;
                const kwLower = w.word.toLowerCase().replace(/[.,!?;:'"]/g, '');
                nodeEls.forEach((node, i) => {
                    const label = elems[i].toLowerCase();
                    if (label.includes(kwLower)) {
                        tl.to(node, {
                            borderColor: 'rgba(16,185,129,0.7)',
                            background: 'rgba(16,185,129,0.08)',
                            boxShadow: '0 0 28px rgba(16,185,129,0.3)',
                            duration: 0.2,
                            ease: 'power2.out'
                        }, w.start);
                        tl.to(node.querySelector('.node-num'), {
                            background: '#10b981',
                            color: '#000',
                            duration: 0.2
                        }, w.start);
                        tl.to(node, {
                            boxShadow: '0 0 0px rgba(16,185,129,0)',
                            duration: 0.5,
                            ease: 'power2.out'
                        }, w.start + 0.3);
                    }
                });
            });

            /* Ensure exact duration */
            tl.to({}, { duration: 0.001 }, S.duration - 0.001);
        });
    </script>
</body>
</html>
