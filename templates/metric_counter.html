<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1080px;
            height: 960px;
            background: #050505;
            font-family: 'Inter', sans-serif;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        .bg {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 42%, #0c0c1e 0%, #050505 100%);
        }

        .metric-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            text-align: center;
        }

        /* Circular ring */
        .ring-svg {
            width: 280px; height: 280px;
            margin: 0 auto 30px;
        }
        .ring-bg {
            fill: none;
            stroke: rgba(255,255,255,0.04);
            stroke-width: 8;
        }
        .ring-fill {
            fill: none;
            stroke: #10b981;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 754;    /* 2 × π × 120 */
            stroke-dashoffset: 754;
            filter: drop-shadow(0 0 8px rgba(16,185,129,0.4));
            transform: rotate(-90deg);
            transform-origin: center;
        }

        .metric-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: #10b981;
            opacity: 0;
        }
        .metric-value .unit {
            font-size: 36px;
            font-weight: 600;
            color: rgba(16,185,129,0.6);
        }

        .metric-label {
            font-size: 26px;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 12px;
            opacity: 0;
            letter-spacing: 1px;
        }

        .metric-sub {
            font-size: 18px;
            font-weight: 400;
            color: #475569;
            margin-top: 8px;
            opacity: 0;
        }

        .ring-container {
            position: relative;
            display: inline-block;
        }

        /* Glow behind */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            width: 300px; height: 300px;
            background: rgba(16,185,129,0.08);
            filter: blur(60px);
            border-radius: 50%;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="glow" id="glow"></div>
    <div class="metric-area" id="area">
        <div class="ring-container">
            <svg class="ring-svg" viewBox="0 0 260 260">
                <circle class="ring-bg" cx="130" cy="130" r="120"/>
                <circle class="ring-fill" id="ring" cx="130" cy="130" r="120"/>
            </svg>
            <div class="metric-value" id="val">
                <span id="num">0</span><span class="unit" id="unit"></span>
            </div>
        </div>
        <div class="metric-label" id="label"></div>
        <div class="metric-sub" id="sub"></div>
    </div>

    <script>
        const S = {{ scene_data_json }};

        /* Parse elements: [value, label, sub?] */
        const elems = S.elements || [];
        const rawValue = elems[0] || '100';
        const labelText = elems[1] || S.text;
        const subText = elems[2] || '';

        /* Extract numeric value and unit */
        const numMatch = rawValue.match(/([0-9,.]+)\s*(.*)/);
        const targetNum = numMatch ? parseFloat(numMatch[1].replace(/,/g, '')) : 100;
        const unitStr = numMatch ? numMatch[2] : '';

        document.getElementById('unit').textContent = unitStr;
        document.getElementById('label').textContent = labelText;
        document.getElementById('sub').textContent = subText;

        /* Ring proportion (cap at 100%) */
        const pct = Math.min(targetNum, 100) / 100;
        const circumference = 2 * Math.PI * 120;  /* ≈ 754 */

        document.fonts.ready.then(() => {
            const tl = gsap.timeline({
                onComplete: () => { document.title = 'DONE'; }
            });

            const countDur = S.duration * 0.6;

            /* Glow in */
            tl.to('#glow', { opacity: 1, duration: 0.5 }, 0.1);

            /* Value appears */
            tl.to('#val', { opacity: 1, duration: 0.3 }, 0.2);

            /* Count up */
            const counter = { v: 0 };
            tl.to(counter, {
                v: targetNum,
                duration: countDur,
                ease: 'power2.out',
                onUpdate: () => {
                    const formatted = counter.v >= 10
                        ? Math.round(counter.v).toLocaleString()
                        : counter.v.toFixed(1);
                    document.getElementById('num').textContent = formatted;
                }
            }, 0.3);

            /* Ring fills */
            tl.to('#ring', {
                strokeDashoffset: circumference * (1 - pct),
                duration: countDur,
                ease: 'power2.out'
            }, 0.3);

            /* Label & sub fade in */
            tl.to('#label', { opacity: 1, y: -5, duration: 0.4 }, 0.3 + countDur * 0.3);
            tl.to('#sub', { opacity: 1, y: -5, duration: 0.4 }, 0.3 + countDur * 0.5);

            /* Word emphasis: pulse the ring */
            S.words.forEach(w => {
                if (!w.emphasis) return;
                tl.to('#ring', {
                    stroke: '#34d399',
                    strokeWidth: 12,
                    duration: 0.12
                }, w.start);
                tl.to('#ring', {
                    stroke: '#10b981',
                    strokeWidth: 8,
                    duration: 0.35
                }, w.start + 0.15);
                tl.to('#glow', {
                    opacity: 0.6,
                    duration: 0.1
                }, w.start);
                tl.to('#glow', {
                    opacity: 0.3,
                    duration: 0.3
                }, w.start + 0.15);
            });

            tl.to({}, { duration: 0.001 }, S.duration - 0.001);
        });
    </script>
</body>
</html>
